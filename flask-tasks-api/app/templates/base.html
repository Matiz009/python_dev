<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Flask Tasks API{% endblock %}</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --text: #1f2937;
            --muted: #4b5563;
            --bg: #f9fafb;
            --surface: #ffffff;
            --border: #e5e7eb;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --text: #f3f4f6;
                --muted: #9ca3af;
                --bg: #111827;
                --surface: #1f2937;
                --border: #374151;
            }
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: var(--text);
            background: var(--bg);
            line-height: 1.6;
        }
        .wrap { max-width: 880px; margin: 0 auto; padding: 0 1.25rem; }
        header.site {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 0;
        }
        header.site nav { display: flex; gap: 1.25rem; flex-wrap: wrap; align-items: center; }
        header.site a { color: var(--muted); text-decoration: none; font-size: 0.95rem; }
        header.site a:hover { color: var(--primary); }
        header.site .brand { font-weight: 700; color: var(--text); margin-right: auto; }
        main { padding: 3rem 0; }
        h1 { font-size: 2rem; margin-bottom: 0.75rem; }
        h2 { font-size: 1.25rem; margin: 2rem 0 0.5rem; }
        p { color: var(--muted); margin-bottom: 1rem; }
        code, pre {
            font-family: ui-monospace, 'Cascadia Code', Consolas, monospace;
            font-size: 0.9rem;
        }
        pre {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            overflow-x: auto;
            margin-bottom: 1rem;
        }
        .btn {
            display: inline-block;
            background: var(--primary);
            color: #fff;
            padding: 0.6rem 1.2rem;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
        }
        .btn:hover { background: var(--primary-dark); }
        table { width: 100%; border-collapse: collapse; margin-bottom: 1rem; }
        th, td { text-align: left; padding: 0.5rem 0.75rem; border-bottom: 1px solid var(--border); }
        th { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.03em; color: var(--muted); }
        footer.site {
            border-top: 1px solid var(--border);
            padding: 1.5rem 0;
            color: var(--muted);
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <header class="site">
        <div class="wrap">
            <nav>
                <a class="brand" href="{{ url_for('pages.index') }}">Flask Tasks API</a>
                <a href="{{ url_for('pages.about') }}">About</a>
                <a href="{{ url_for('pages.about_me') }}">About Me</a>
                <a href="{{ url_for('pages.contact') }}">Contact</a>
                <a href="/api/v1">API</a>
            </nav>
        </div>
    </header>

    <main class="wrap">
        {% block content %}{% endblock %}
    </main>

    <footer class="site">
        <div class="wrap">Flask Tasks API &middot; deployed on Vercel</div>
    </footer>
</body>
</html>
