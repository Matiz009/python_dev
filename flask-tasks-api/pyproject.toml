[project]
name = "flask-tasks-api"
version = "1.0.0"
description = "Production-ready Flask REST API for tasks, deployable to Vercel"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "C4", "SIM", "RUF"]
ignore = [
    "B008",   # Flask/SQLAlchemy idioms use calls in defaults
    "RUF012", # mutable class attrs on config objects are intentional
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"migrations/*" = ["E501", "I001"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]

[tool.coverage.run]
source = ["app"]
omit = ["*/migrations/*", "*/tests/*"]
