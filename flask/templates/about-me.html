<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Me - Alex Mercer</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .profile-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            overflow: hidden;
            text-align: center;
            padding: 40px 30px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .avatar-container {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 20px auto;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--accent-color);
        }

        .name {
            font-size: 1.75rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .title {
            color: var(--accent-color);
            font-size: 1rem;
            font-weight: 500;
            margin-bottom: 20px;
        }

        .bio {
            color: var(--text-secondary);
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .skills {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 8px;
            margin-bottom: 30px;
        }

        .skill-badge {
            background-color: rgba(56, 189, 248, 0.1);
            color: var(--accent-color);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
        }

        .btn {
            background-color: var(--accent-color);
            color: var(--bg-color);
            padding: 10px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        .btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="profile-card">
        <div class="avatar-container">
            <!-- Placeholder image using Unsplash -->
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=400&auto=format&fit=crop&q=80" alt="Alex Mercer Avatar" class="avatar">
        </div>
        
        <h1 class="name">Alex Mercer</h1>
        <p class="title">Full-Stack Developer & UI Enthusiast</p>
        
        <p class="bio">
            Hi there! I build accessible, pixel-perfect, and performant web applications. Passionate about modern JavaScript frameworks, clean architecture, and minimalistic design.
        </p>

        <div class="skills">
            <span class="skill-badge">HTML5 / CSS3</span>
            <span class="skill-badge">JavaScript (ES6+)</span>
            <span class="skill-badge">React</span>
            <span class="skill-badge">Node.js</span>
            <span class="skill-badge">Git</span>
        </div>

        <div class="social-links">
            <a href="#contact" class="btn">Get in Touch</a>
        </div>
    </div>

</body>
</html>
